<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red-Black Tree Simulator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
}

button,
input {
    font: inherit;
}

.app {
    width: 100%;
    max-width: 1450px;
    margin: auto;
    padding: 16px;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 16px;
}

.header h1 {
    margin: 0;
    font-size: clamp(24px, 4vw, 36px);
}

.header p {
    margin: 7px 0 0;
    color: #94a3b8;
}

/* CONTROLS */

.controls {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
}

.controls input {
    width: 150px;
    min-width: 0;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #0f172a;
    color: white;
    outline: none;
}

.controls input:focus {
    border-color: #38bdf8;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px 13px;
    background: #334155;
    color: white;
    cursor: pointer;
    font-weight: 600;
    min-height: 42px;
}

button:hover {
    background: #475569;
}

button:active {
    transform: scale(.98);
}

.btn-insert {
    background: #16a34a;
}

.btn-delete {
    background: #dc2626;
}

.btn-play {
    background: #2563eb;
}

.btn-reset {
    background: #7c3aed;
}

/* LAYOUT */

.layout {
    display: grid;
    grid-template-columns: minmax(0, 1.7fr) minmax(300px, .8fr);
    gap: 14px;
}

.card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 14px;
    min-width: 0;
}

.card h2,
.card h3 {
    margin-top: 0;
}

/* TREE AREA */

.tree-wrapper {
    width: 100%;
    height: min(62vw, 600px);
    min-height: 380px;
    background: #020617;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
}

#treeCanvas {
    width: 100%;
    height: 100%;
    display: block;
}

/* TREE */

.edge {
    stroke: #64748b;
    stroke-width: 2.5;
}

.node-circle {
    stroke: white;
    stroke-width: 2.5;
}

.node-red {
    fill: #dc2626;
}

.node-black {
    fill: #020617;
}

.node-highlight {
    stroke: #facc15;
    stroke-width: 6;
    filter: drop-shadow(0 0 7px #facc15);
}

.node-text {
    fill: white;
    font-weight: bold;
    font-size: 14px;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
}

/* STATUS */

.status {
    margin-top: 10px;
    padding: 11px;
    background: #0f172a;
    border-radius: 8px;
    border: 1px solid #334155;
    line-height: 1.5;
}

/* HISTORY */

.history {
    max-height: 400px;
    overflow-y: auto;
}

.history-empty {
    color: #94a3b8;
}

.step {
    padding: 10px;
    margin-bottom: 7px;
    border-radius: 8px;
    background: #334155;
    cursor: pointer;
    border: 1px solid transparent;
}

.step:hover {
    border-color: #64748b;
}

.step.active {
    background: #1d4ed8;
    border-color: #60a5fa;
}

.step-title {
    font-weight: bold;
    font-size: 14px;
}

.step-description {
    margin-top: 4px;
    color: #cbd5e1;
    font-size: 13px;
    line-height: 1.4;
}

/* DYNAMIC RULE */

.rule-panel {
    margin-top: 14px;
}

.rule {
    border-radius: 9px;
    padding: 13px;
    border: 1px solid #475569;
    background: #0f172a;
}

.rule-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.rule-label {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 6px;
    background: #334155;
    font-size: 12px;
    margin-bottom: 9px;
}

.rule-action {
    margin-top: 9px;
    padding: 9px;
    background: #1e293b;
    border-radius: 7px;
}

.idle-rule {
    color: #94a3b8;
}

/* MOBILE */

@media (max-width: 900px) {

    .app {
        padding: 10px;
    }

    .layout {
        grid-template-columns: 1fr;
    }

    .tree-wrapper {
        height: 470px;
        min-height: 330px;
    }

    .history {
        max-height: 320px;
    }
}

@media (max-width: 600px) {

    .header h1 {
        font-size: 24px;
    }

    .header p {
        font-size: 13px;
    }

    .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .controls input {
        width: 100%;
        grid-column: 1 / -1;
    }

    .controls button {
        width: 100%;
        padding: 10px 6px;
        font-size: 13px;
    }

    .tree-wrapper {
        height: 390px;
    }

    .card {
        padding: 10px;
    }
}

@media (max-width: 380px) {

    .controls {
        grid-template-columns: 1fr;
    }

    .controls input {
        grid-column: auto;
    }

    .tree-wrapper {
        height: 350px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <h1>🔴⚫ Red-Black Tree Simulator</h1>
        <p>Step-by-step insertion with automatic case detection</p>
    </header>

    <!-- CONTROLS -->

    <section class="controls">

        <input
            id="valueInput"
            type="number"
            inputmode="numeric"
            placeholder="Enter number"
        >

        <button class="btn-insert" id="insertBtn">
            ➕ Insert
        </button>

        <button class="btn-delete" id="deleteBtn">
            🗑 Delete
        </button>

        <button class="btn-play" id="playBtn">
            ▶ Play
        </button>

        <button id="pauseBtn">
            ⏸ Pause
        </button>

        <button id="prevBtn">
            ◀ Previous
        </button>

        <button id="nextBtn">
            Next ▶
        </button>

        <button class="btn-reset" id="resetBtn">
            ↻ Reset
        </button>

    </section>


    <!-- MAIN -->

    <main class="layout">

        <!-- TREE -->

        <section class="card">

            <h2>Tree</h2>

            <div class="tree-wrapper">
                <svg id="treeCanvas"
                     viewBox="0 0 1000 600"
                     preserveAspectRatio="xMidYMid meet">
                </svg>
            </div>

            <div class="status" id="status">
                Ready. Enter a number and press Insert.
            </div>

        </section>


        <!-- SIDE -->

        <aside>

            <section class="card">

                <h2>📜 Step History</h2>

                <div id="history" class="history">
                    <div class="history-empty">
                        No operation yet.
                    </div>
                </div>

            </section>


            <section class="card rule-panel">

                <h2>📖 Current Rule</h2>

                <div id="rulePanel" class="rule">
                    <div class="idle-rule">
                        The rule applied to the current step
                        will appear here.
                    </div>
                </div>

            </section>

        </aside>

    </main>

</div>


<script>

/* =========================================================
   CONSTANTS
========================================================= */

const RED = "RED";
const BLACK = "BLACK";

let root = null;

let history = [];

let currentStep = -1;

let playing = false;

let playTimer = null;


/* =========================================================
   NODE
========================================================= */

class Node {

    constructor(value) {

        this.value = value;

        this.color = RED;

        this.left = null;

        this.right = null;

        this.parent = null;
    }
}


/* =========================================================
   HELPERS
========================================================= */

function cloneTree(node) {

    if (!node) return null;

    const copy = new Node(node.value);

    copy.color = node.color;

    copy.left = cloneTree(node.left);

    copy.right = cloneTree(node.right);

    if (copy.left) {
        copy.left.parent = copy;
    }

    if (copy.right) {
        copy.right.parent = copy;
    }

    return copy;
}


function addStep(title, description, ruleType = "none", nodes = []) {

    history.push({

        title,

        description,

        ruleType,

        nodes,

        snapshot: cloneTree(root)
    });
}


/* =========================================================
   INSERT BUTTON
========================================================= */

function insertValue() {

    const input = document.getElementById("valueInput");

    const value = Number(input.value);

    if (!Number.isInteger(value)) {

        alert("Please enter a valid integer.");

        return;
    }

    input.value = "";

    stopPlaying();

    history = [];

    currentStep = -1;

    performInsert(value);

    renderHistory();

    currentStep = 0;

    renderCurrentStep();
}


/* =========================================================
   INSERT
========================================================= */

function performInsert(value) {

    const newNode = new Node(value);

    addStep(
        `Insert ${value}`,
        `Start normal BST insertion. Node ${value} is initially RED.`,
        "insert",
        [value]
    );


    /* EMPTY TREE */

    if (!root) {

        root = newNode;

        addStep(
            "Root Created",
            `${value} becomes the root of the tree.`,
            "root",
            [value]
        );

        root.color = BLACK;

        addStep(
            "Root Rule",
            `Root must always be BLACK. ${value} is recolored RED → BLACK.`,
            "root",
            [value]
        );

        return;
    }


    /* BST INSERTION */

    let current = root;

    while (true) {

        if (value === current.value) {

            addStep(
                "Duplicate Value",
                `${value} already exists. Duplicate values are not inserted.`,
                "none",
                [value]
            );

            return;
        }


        if (value < current.value) {

            if (!current.left) {

                current.left = newNode;

                newNode.parent = current;

                break;

            } else {

                current = current.left;
            }

        } else {

            if (!current.right) {

                current.right = newNode;

                newNode.parent = current;

                break;

            } else {

                current = current.right;
            }
        }
    }


    addStep(
        "BST Insert Complete",
        `${value} was inserted as a RED node under ${newNode.parent.value}.`,
        "insert",
        [value, newNode.parent.value]
    );


    fixInsertion(newNode);
}


/* =========================================================
   RED-BLACK INSERTION FIX
========================================================= */

function fixInsertion(z) {

    while (z !== root && z.parent.color === RED) {

        const parent = z.parent;

        const grandparent = parent.parent;


        /* =========================================
           PARENT IS LEFT CHILD
        ========================================= */

        if (parent === grandparent.left) {

            const uncle = grandparent.right;


            /* CASE 1 */

            if (uncle && uncle.color === RED) {

                addStep(
                    "Case 1 — Red Uncle",
                    `Parent ${parent.value} and Uncle ${uncle.value} are RED.`,
                    "case1",
                    [
                        z.value,
                        parent.value,
                        uncle.value,
                        grandparent.value
                    ]
                );


                parent.color = BLACK;

                uncle.color = BLACK;

                grandparent.color = RED;


                addStep(
                    "Case 1 — Recolor",
                    `Parent ${parent.value} → BLACK, Uncle ${uncle.value} → BLACK, Grandparent ${grandparent.value} → RED.`,
                    "case1",
                    [
                        parent.value,
                        uncle.value,
                        grandparent.value
                    ]
                );


                z = grandparent;

            }

            /* CASE 2 + 3 */

            else {

                /* TRIANGLE */

                if (z === parent.right) {

                    addStep(
                        "Case 2 — Triangle",
                        `Parent ${parent.value} and Node ${z.value} form a triangle.`,
                        "case2",
                        [
                            z.value,
                            parent.value,
                            grandparent.value
                        ]
                    );


                    rotateLeft(parent);


                    addStep(
                        "Case 2 — Rotation",
                        `Left rotation performed at Parent ${parent.value}. The triangle becomes a straight line.`,
                        "case2",
                        [
                            z.value,
                            parent.value
                        ]
                    );


                    z = parent;
                }


                /* LINE */

                addStep(
                    "Case 3 — Line",
                    `Node ${z.value} and Parent ${z.parent.value} form a straight line. Uncle is BLACK.`,
                    "case3",
                    [
                        z.value,
                        z.parent.value,
                        grandparent.value
                    ]
                );


                z.parent.color = BLACK;

                grandparent.color = RED;


                rotateRight(grandparent);


                addStep(
                    "Case 3 — Rotation + Recolor",
                    `Right rotation at Grandparent ${grandparent.value}. Parent becomes BLACK and Grandparent becomes RED.`,
                    "case3",
                    [
                        z.value,
                        z.parent.value,
                        grandparent.value
                    ]
                );
            }

        }

        /* =========================================
           PARENT IS RIGHT CHILD — MIRROR
        ========================================= */

        else {

            const uncle = grandparent.left;


            /* CASE 1 */

            if (uncle && uncle.color === RED) {

                addStep(
                    "Case 1 — Red Uncle",
                    `Parent ${parent.value} and Uncle ${uncle.value} are RED.`,
                    "case1",
                    [
                        z.value,
                        parent.value,
                        uncle.value,
                        grandparent.value
                    ]
                );


                parent.color = BLACK;

                uncle.color = BLACK;

                grandparent.color = RED;


                addStep(
                    "Case 1 — Recolor",
                    `Parent ${parent.value} → BLACK, Uncle ${uncle.value} → BLACK, Grandparent ${grandparent.value} → RED.`,
                    "case1",
                    [
                        parent.value,
                        uncle.value,
                        grandparent.value
                    ]
                );


                z = grandparent;
            }

            /* CASE 2 + 3 MIRROR */

            else {

                /* TRIANGLE */

                if (z === parent.left) {

                    addStep(
                        "Case 2 — Mirror Triangle",
                        `Node ${z.value} and Parent ${parent.value} form a mirror triangle.`,
                        "case2",
                        [
                            z.value,
                            parent.value,
                            grandparent.value
                        ]
                    );


                    rotateRight(parent);


                    addStep(
                        "Case 2 — Rotation",
                        `Right rotation performed at Parent ${parent.value}.`,
                        "case2",
                        [
                            z.value,
                            parent.value
                        ]
                    );


                    z = parent;
                }


                /* LINE */

                addStep(
                    "Case 3 — Mirror Line",
                    `Node ${z.value} and Parent ${z.parent.value} form a straight mirror line. Uncle is BLACK.`,
                    "case3",
                    [
                        z.value,
                        z.parent.value,
                        grandparent.value
                    ]
                );


                z.parent.color = BLACK;

                grandparent.color = RED;


                rotateLeft(grandparent);


                addStep(
                    "Case 3 — Rotation + Recolor",
                    `Left rotation at Grandparent ${grandparent.value}. Parent becomes BLACK and Grandparent becomes RED.`,
                    "case3",
                    [
                        z.value,
                        z.parent.value,
                        grandparent.value
                    ]
                );
            }
        }
    }


    /* ROOT MUST BE BLACK */

    if (root.color !== BLACK) {

        root.color = BLACK;

        addStep(
            "Root Rule",
            `The root must always be BLACK. Root ${root.value} is recolored BLACK.`,
            "root",
            [root.value]
        );
    }
}


/* =========================================================
   LEFT ROTATION
========================================================= */

function rotateLeft(x) {

    const y = x.right;

    if (!y) return;

    x.right = y.left;

    if (y.left) {
        y.left.parent = x;
    }

    y.parent = x.parent;

    if (!x.parent) {

        root = y;

    } else if (x === x.parent.left) {

        x.parent.left = y;

    } else {

        x.parent.right = y;
    }

    y.left = x;

    x.parent = y;
}


/* =========================================================
   RIGHT ROTATION
========================================================= */

function rotateRight(x) {

    const y = x.left;

    if (!y) return;

    x.left = y.right;

    if (y.right) {
        y.right.parent = x;
    }

    y.parent = x.parent;

    if (!x.parent) {

        root = y;

    } else if (x === x.parent.left) {

        x.parent.left = y;

    } else {

        x.parent.right = y;
    }

    y.right = x;

    x.parent = y;
}


/* =========================================================
   DELETE
========================================================= */

function deleteValue() {

    const input = document.getElementById("valueInput");

    const value = Number(input.value);

    if (!Number.isInteger(value)) {

        alert("Please enter a valid integer.");

        return;
    }

    input.value = "";

    stopPlaying();

    history = [];

    currentStep = -1;


    const node = findNode(root, value);

    if (!node) {

        addStep(
            "Delete",
            `${value} does not exist in the tree.`,
            "none",
            [value]
        );

    } else {

        /*
         Educational BST deletion.
         Full RB deletion fix-up can be added separately.
        */

        addStep(
            "Delete",
            `Deleting node ${value}.`,
            "delete",
            [value]
        );

        bstDelete(node);

        if (root) {

            root.color = BLACK;
        }

        addStep(
            "Delete Complete",
            `${value} has been removed. Root is checked and kept BLACK.`,
            "delete",
            []
        );
    }


    renderHistory();

    currentStep = 0;

    renderCurrentStep();
}


/* =========================================================
   BST DELETE
========================================================= */

function bstDelete(node) {

    if (!node.left && !node.right) {

        replaceNode(node, null);

        return;
    }


    if (node.left && !node.right) {

        replaceNode(node, node.left);

        return;
    }


    if (!node.left && node.right) {

        replaceNode(node, node.right);

        return;
    }


    let successor = node.right;

    while (successor.left) {

        successor = successor.left;
    }


    node.value = successor.value;

    node.color = successor.color;

    bstDelete(successor);
}


/* =========================================================
   REPLACE
========================================================= */

function replaceNode(oldNode, newNode) {

    if (!oldNode.parent) {

        root = newNode;

    } else if (oldNode === oldNode.parent.left) {

        oldNode.parent.left = newNode;

    } else {

        oldNode.parent.right = newNode;
    }


    if (newNode) {

        newNode.parent = oldNode.parent;
    }
}


/* =========================================================
   FIND
========================================================= */

function findNode(node, value) {

    if (!node) return null;

    if (node.value === value) return node;

    if (value < node.value) {

        return findNode(node.left, value);

    } else {

        return findNode(node.right, value);
    }
}


/* =========================================================
   HISTORY UI
========================================================= */

function renderHistory() {

    const container = document.getElementById("history");

    container.innerHTML = "";


    if (!history.length) {

        container.innerHTML =
            `<div class="history-empty">
                No operation yet.
            </div>`;

        return;
    }


    history.forEach((step, index) => {

        const element = document.createElement("div");

        element.className = "step";

        element.innerHTML = `
            <div class="step-title">
                Step ${index + 1}: ${step.title}
            </div>

            <div class="step-description">
                ${step.description}
            </div>
        `;


        element.addEventListener("click", () => {

            currentStep = index;

            renderCurrentStep();
        });


        container.appendChild(element);
    });
}


/* =========================================================
   CURRENT STEP
========================================================= */

function renderCurrentStep() {

    if (currentStep < 0 || currentStep >= history.length) {

        drawTree(root, []);

        showIdleRule();

        return;
    }


    const step = history[currentStep];

    drawTree(step.snapshot, step.nodes);

    updateRulePanel(step);

    updateStatus(step);

    updateHistorySelection();
}


/* =========================================================
   HISTORY SELECTION
========================================================= */

function updateHistorySelection() {

    document
        .querySelectorAll(".step")
        .forEach((element, index) => {

            element.classList.toggle(
                "active",
                index === currentStep
            );
        });
}


/* =========================================================
   STATUS
========================================================= */

function updateStatus(step) {

    document.getElementById("status").innerHTML = `
        <strong>Step ${currentStep + 1} / ${history.length}</strong>
        <br>
        ${step.description}
    `;
}


/* =========================================================
   DYNAMIC RULE PANEL
========================================================= */

function updateRulePanel(step) {

    const panel = document.getElementById("rulePanel");

    let html = "";


    if (step.ruleType === "case1") {

        html = `
            <div class="rule-title">
                🔴 Case 1 — Red Uncle
            </div>

            <div class="rule-label">
                ACTUAL CASE DETECTED
            </div>

            <div>
                Parent and Uncle are RED.
            </div>

            <div class="rule-action">
                <strong>Rule Applied:</strong><br>
                Recolor Parent and Uncle BLACK,
                then recolor Grandparent RED.
            </div>
        `;
    }


    else if (step.ruleType === "case2") {

        html = `
            <div class="rule-title">
                🔺 Case 2 — Triangle
            </div>

            <div class="rule-label">
                ACTUAL CASE DETECTED
            </div>

            <div>
                Parent and newly inserted node form
                a triangle.
            </div>

            <div class="rule-action">
                <strong>Rule Applied:</strong><br>
                Rotate around the Parent to convert
                the triangle into a line.
            </div>
        `;
    }


    else if (step.ruleType === "case3") {

        html = `
            <div class="rule-title">
                📏 Case 3 — Line
            </div>

            <div class="rule-label">
                ACTUAL CASE DETECTED
            </div>

            <div>
                Parent and newly inserted node form
                a straight line and Uncle is BLACK.
            </div>

            <div class="rule-action">
                <strong>Rule Applied:</strong><br>
                Rotate around the Grandparent and
                recolor Parent and Grandparent.
            </div>
        `;
    }


    else if (step.ruleType === "root") {

        html = `
            <div class="rule-title">
                ⚫ Root Rule
            </div>

            <div class="rule-label">
                ROOT PROPERTY
            </div>

            <div>
                The root of a Red-Black Tree must
                always be BLACK.
            </div>

            <div class="rule-action">
                <strong>Action:</strong><br>
                Root recolored BLACK.
            </div>
        `;
    }


    else if (step.ruleType === "insert") {

        html = `
            <div class="rule-title">
                🌱 BST Insertion
            </div>

            <div class="rule-label">
                INSERTION STEP
            </div>

            <div>
                The new node is inserted according
                to normal Binary Search Tree rules.
            </div>

            <div class="rule-action">
                <strong>Red-Black Rule:</strong><br>
                Newly inserted nodes start as RED.
            </div>
        `;
    }


    else if (step.ruleType === "delete") {

        html = `
            <div class="rule-title">
                🗑️ Deletion
            </div>

            <div class="rule-label">
                DELETE STEP
            </div>

            <div>
                Node deletion is being performed.
            </div>
        `;
    }


    else {

        html = `
            <div class="idle-rule">
                No Red-Black insertion case is triggered
                at this step.
            </div>
        `;
    }


    panel.innerHTML = html;
}


function showIdleRule() {

    document.getElementById("rulePanel").innerHTML = `
        <div class="idle-rule">
            Insert a value and move through the
            steps to see the exact rule applied.
        </div>
    `;
}


/* =========================================================
   DRAW TREE
========================================================= */

function drawTree(treeRoot, highlightValues = []) {

    const svg = document.getElementById("treeCanvas");

    svg.innerHTML = "";


    if (!treeRoot) return;


    const nodes = [];

    /*
       Responsive tree coordinates.
       The viewBox remains fixed, so the SVG scales
       automatically on phone and laptop.
    */

    function calculate(node, depth, left, right) {

        if (!node) return;

        const x = (left + right) / 2;

        const y = 65 + depth * 95;

        nodes.push({
            node,
            x,
            y
        });


        calculate(
            node.left,
            depth + 1,
            left,
            x
        );


        calculate(
            node.right,
            depth + 1,
            x,
            right
        );
    }


    calculate(treeRoot, 0, 50, 950);


    /* EDGES */

    nodes.forEach(item => {

        if (item.node.left) {

            const child = nodes.find(
                n => n.node === item.node.left
            );

            drawEdge(
                svg,
                item.x,
                item.y,
                child.x,
                child.y
            );
        }


        if (item.node.right) {

            const child = nodes.find(
                n => n.node === item.node.right
            );

            drawEdge(
                svg,
                item.x,
                item.y,
                child.x,
                child.y
            );
        }
    });


    /* NODES */

    nodes.forEach(item => {

        const group =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "g"
            );


        const highlighted =
            highlightValues.includes(
                item.node.value
            );


        const circle =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"
            );


        circle.setAttribute(
            "cx",
            item.x
        );

        circle.setAttribute(
            "cy",
            item.y
        );

        circle.setAttribute(
            "r",
            26
        );


        circle.setAttribute(
            "class",
            `node-circle ${
                item.node.color === RED
                    ? "node-red"
                    : "node-black"
            } ${
                highlighted
                    ? "node-highlight"
                    : ""
            }`
        );


        const text =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );


        text.setAttribute(
            "x",
            item.x
        );

        text.setAttribute(
            "y",
            item.y
        );


        text.setAttribute(
            "class",
            "node-text"
        );


        text.textContent =
            item.node.value;


        group.appendChild(circle);

        group.appendChild(text);

        svg.appendChild(group);
    });
}


/* =========================================================
   EDGE
========================================================= */

function drawEdge(svg, x1, y1, x2, y2) {

    const line =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );


    line.setAttribute("x1", x1);

    line.setAttribute("y1", y1);

    line.setAttribute("x2", x2);

    line.setAttribute("y2", y2);

    line.setAttribute("class", "edge");


    svg.appendChild(line);
}


/* =========================================================
   NEXT
========================================================= */

function nextStep() {

    if (currentStep < history.length - 1) {

        currentStep++;

        renderCurrentStep();

    } else {

        stopPlaying();
    }
}


/* =========================================================
   PREVIOUS
========================================================= */

function previousStep() {

    if (currentStep > 0) {

        currentStep--;

        renderCurrentStep();
    }
}


/* =========================================================
   PLAY
========================================================= */

function playSteps() {

    if (playing || !history.length) return;

    playing = true;

    playTimer = setInterval(() => {

        if (currentStep < history.length - 1) {

            currentStep++;

            renderCurrentStep();

        } else {

            stopPlaying();
        }

    }, 1100);
}


/* =========================================================
   PAUSE
========================================================= */

function stopPlaying() {

    playing = false;

    clearInterval(playTimer);

    playTimer = null;
}


/* =========================================================
   RESET
========================================================= */

function resetTree() {

    stopPlaying();

    root = null;

    history = [];

    currentStep = -1;

    document.getElementById("history").innerHTML = `
        <div class="history-empty">
            No operation yet.
        </div>
    `;

    document.getElementById("status").innerHTML =
        "Ready. Enter a number and press Insert.";

    showIdleRule();

    drawTree(null);
}


/* =========================================================
   BUTTON EVENTS
========================================================= */

document
    .getElementById("insertBtn")
    .addEventListener("click", insertValue);


document
    .getElementById("deleteBtn")
    .addEventListener("click", deleteValue);


document
    .getElementById("playBtn")
    .addEventListener("click", playSteps);


document
    .getElementById("pauseBtn")
    .addEventListener("click", stopPlaying);


document
    .getElementById("prevBtn")
    .addEventListener("click", previousStep);


document
    .getElementById("nextBtn")
    .addEventListener("click", nextStep);


document
    .getElementById("resetBtn")
    .addEventListener("click", resetTree);


/* ENTER KEY */

document
    .getElementById("valueInput")
    .addEventListener("keydown", event => {

        if (event.key === "Enter") {

            insertValue();
        }
    });


/* INITIAL */

drawTree(null);

</script>
